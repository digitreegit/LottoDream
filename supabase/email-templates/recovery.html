<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reset access</title>
</head>
<body style="margin:0;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;color:#334155;background:#f8fafc;">
  <p style="margin:0 0 8px 0;font-size:18px;font-weight:700;color:#111827;">Lotto Dream</p>
  <p style="margin:0 0 16px 0;">Hello,</p>
  <p style="margin:0 0 16px 0;">We got a request to update sign-in access for <strong>{{ .Email }}</strong>.</p>
  <p style="margin:0 0 24px 0;">
    <a href="{{ .ConfirmationURL }}" style="color:#0f766e;font-weight:600;">Continue on Lotto Dream</a>
  </p>
  <p style="margin:0 0 8px 0;font-size:13px;color:#64748b;">This link stops working after a while.</p>
  <p style="margin:0;font-size:13px;color:#64748b;">
    <a href="{{ .SiteURL }}" style="color:#64748b;">{{ .SiteURL }}</a>
  </p>
</body>
</html>
